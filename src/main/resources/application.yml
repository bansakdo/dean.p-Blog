spring:
  application:
    name: dean-p-blog
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  admin:
    bootstrap:
      login-id: ${ADMIN_LOGIN_ID:}
      password: ${ADMIN_PASSWORD:}
