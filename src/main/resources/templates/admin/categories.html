<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle})}"></head>
<body class="admin-page">
<header th:replace="~{fragments/site :: header}"></header>
<main class="shell page-space">
  <header class="admin-heading">
    <div><h1>카테고리</h1><p th:text="|${categoryRows.size()}개 · 정렬 순서가 작을수록 앞에 보입니다|">0개</p></div>
  </header>
  <p class="admin-notice" th:if="${param.saved}" role="status">저장했습니다.</p>
  <p class="admin-notice" th:if="${param.deleted}" role="status">카테고리를 삭제했습니다.</p>
  <p class="admin-error" th:if="${param.conflict}" role="alert">다른 요청과 겹쳐 저장하지 못했습니다. 화면을 새로 보고 다시 시도하세요.</p>
  <p class="admin-error" th:if="${error}" th:text="${error}" role="alert">오류</p>

  <ul class="admin-terms" th:unless="${categoryRows.isEmpty()}">
    <li class="admin-term" th:each="category : ${categoryRows}">
      <form class="admin-term-form" method="post" th:action="@{/admin/categories/{id}(id=${category.id})}">
        <label><span>이름</span><input type="text" name="name" th:value="${category.name}" maxlength="100" required></label>
        <label><span>주소(slug)</span><input type="text" name="slug" th:value="${category.slug}" maxlength="150"></label>
        <label class="admin-term-order"><span>순서</span><input type="number" name="sortOrder" th:value="${category.sortOrder}" required></label>
        <button class="admin-button" type="submit">저장</button>
      </form>
      <div class="admin-term-meta">
        <span th:text="|글 ${category.postCount}편 · 시리즈 ${category.seriesCount}개|">글 0편</span>
        <form method="post" th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
              th:attr="data-confirm=|카테고리 ‘${category.name}’을 삭제할까요?|">
          <button class="admin-link-button" type="submit">삭제</button>
        </form>
      </div>
    </li>
  </ul>
  <p class="empty-state" th:if="${categoryRows.isEmpty()}">아직 카테고리가 없습니다.</p>

  <section class="admin-images" aria-labelledby="new-category-title">
    <h2 id="new-category-title">새 카테고리</h2>
    <form class="admin-term-form" method="post" th:action="@{/admin/categories}">
      <label><span>이름</span><input type="text" name="name" th:value="${draft?.name}" maxlength="100" required></label>
      <label><span>주소(slug)</span><input type="text" name="slug" th:value="${draft?.slug}" maxlength="150" placeholder="비우면 이름으로 만듭니다"></label>
      <label class="admin-term-order"><span>순서</span><input type="number" name="sortOrder" th:value="${draft?.sortOrder} ?: 0" required></label>
      <button class="admin-button primary" type="submit">추가</button>
    </form>
    <p class="admin-help">주소를 바꾸면 기존 카테고리 링크가 끊깁니다. 쓰고 있는 글이나 시리즈가 있으면 삭제할 수 없습니다.</p>
  </section>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
<script defer th:src="@{/js/admin-post-editor.js}"></script>
</body>
</html>
