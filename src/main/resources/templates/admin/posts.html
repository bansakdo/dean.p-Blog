<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle})}"></head>
<body class="admin-page">
<header th:replace="~{fragments/site :: header}"></header>
<main class="shell page-space">
  <header class="admin-heading">
    <div><h1>글 관리</h1><p th:text="|전체 ${totalPosts}편 · 최근 수정순|">전체 0편 · 최근 수정순</p></div>
    <a class="admin-button primary" th:href="@{/admin/posts/new}">새 글</a>
  </header>
  <p class="empty-state" th:if="${posts.isEmpty()}">아직 글이 없습니다.</p>
  <div class="admin-table-scroll" th:unless="${posts.isEmpty()}">
    <table class="admin-table">
      <thead><tr><th scope="col">제목</th><th scope="col">상태</th><th scope="col">수정일</th><th scope="col"><span class="visually-hidden">동작</span></th></tr></thead>
      <tbody>
        <tr th:each="post : ${posts}">
          <td><a th:href="@{/admin/posts/{id}/edit(id=${post.id})}" th:text="${post.title}">제목</a></td>
          <td><span class="admin-badge" th:classappend="${post.published} ? 'is-published'" th:text="${post.published} ? '공개' : '초안'">초안</span></td>
          <td><time th:datetime="${post.updatedAt}" th:text="${#temporals.format(post.updatedAt, 'yyyy.MM.dd HH:mm')}">2026.01.01 00:00</time></td>
          <td><a th:if="${post.published}" th:href="@{/posts/{slug}(slug=${post.slug})}">보기</a></td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav class="admin-pagination" aria-label="글 관리 페이지" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 1}" th:href="@{/admin/posts(page=${currentPage - 1})}">이전</a>
    <span th:text="|${currentPage} / ${totalPages}|">1 / 1</span>
    <a th:if="${currentPage < totalPages}" th:href="@{/admin/posts(page=${currentPage + 1})}">다음</a>
  </nav>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
