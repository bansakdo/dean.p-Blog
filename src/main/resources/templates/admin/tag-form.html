<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle})}"></head>
<body class="admin-page">
<header th:replace="~{fragments/site :: header}"></header>
<main class="shell page-space">
  <header class="admin-heading">
    <div><h1 th:text="${tagRow.name}">태그</h1><p th:text="|글 ${tagRow.postCount}편에 붙어 있습니다 (삭제한 글 포함)|">글 0편</p></div>
    <a th:href="@{/admin/tags}">← 태그 목록</a>
  </header>
  <p class="admin-notice" th:if="${param.saved}" role="status">저장했습니다.</p>
  <p class="admin-error" th:if="${error}" th:text="${error}" role="alert">오류</p>

  <form class="admin-form" method="post" th:action="@{/admin/tags/{id}(id=${tagRow.id})}">
    <label for="tag-name">이름</label>
    <input id="tag-name" type="text" name="name" th:value="${tagRow.name}" maxlength="100" required>
    <label for="tag-slug">주소(slug)</label>
    <input id="tag-slug" type="text" name="slug" th:value="${tagRow.slug}" maxlength="150" aria-describedby="tag-slug-help">
    <p class="admin-help" id="tag-slug-help">비우면 이름으로 만듭니다. 바꾸면 기존 태그 링크가 끊깁니다.</p>
    <div class="admin-actions"><button class="admin-button primary" type="submit">저장</button></div>
  </form>

  <section class="admin-images" aria-labelledby="tag-merge-title" th:unless="${mergeTargets.isEmpty()}">
    <h2 id="tag-merge-title">다른 태그로 병합</h2>
    <form class="admin-filter" method="post" th:action="@{/admin/tags/{id}/merge(id=${tagRow.id})}"
          th:attr="data-confirm=|‘${tagRow.name}’ 태그를 고른 태그로 합치고 지울까요? 되돌릴 수 없습니다.|">
      <label class="visually-hidden" for="tag-merge-target">남길 태그</label>
      <select id="tag-merge-target" name="targetId" required>
        <option value="">남길 태그 선택</option>
        <option th:each="target : ${mergeTargets}" th:value="${target.id}" th:text="|${target.name} (${target.postCount}편)|">태그</option>
      </select>
      <button class="admin-button" type="submit">병합</button>
    </form>
    <p class="admin-help">이 태그가 붙은 글에 고른 태그를 붙이고 이 태그는 지웁니다. 철자만 다른 중복 태그를 정리할 때 씁니다.</p>
  </section>

  <form class="admin-danger-zone" method="post" th:action="@{/admin/tags/{id}/delete(id=${tagRow.id})}"
        th:attr="data-confirm=|‘${tagRow.name}’ 태그를 삭제할까요? 글 ${tagRow.postCount}편에서 빠지며 되돌릴 수 없습니다.|">
    <button class="admin-button danger" type="submit">태그 삭제</button>
    <p class="admin-help">글은 그대로 남고 이 태그만 빠집니다.</p>
  </form>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
<script defer th:src="@{/js/admin-post-editor.js}"></script>
</body>
</html>
