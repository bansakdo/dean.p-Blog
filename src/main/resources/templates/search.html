<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle})}"></head>
<body class="posts-page">
<header th:replace="~{fragments/site :: header}"></header>
<main class="shell page-space">
  <header class="page-intro"><div><h1>검색</h1><p>제목·요약·본문에서 검색합니다.</p></div></header>
  <form class="post-search" method="get" th:action="@{/search}" role="search" aria-label="글 검색">
    <label for="post-search">검색어</label>
    <input id="post-search" name="q" type="search" th:value="${search}" placeholder="제목, 요약, 본문 검색">
    <button type="submit">검색</button>
  </form>
  <section th:if="${search != null}" aria-label="검색 결과">
    <p class="results-count"><span th:text="|‘${search}’ 검색 결과 |"></span><strong th:text="|${posts.size()}편|">0편</strong></p>
      <div class="post-list" th:if="${!posts.isEmpty()}">
        <article th:each="post : ${posts}">
          <div class="post-meta"><span class="post-category" th:if="${post.categoryName != null}" th:text="${post.categoryName}">카테고리</span><time th:datetime="${post.publishedAt}" th:text="${#temporals.format(post.publishedAt, 'yyyy.MM.dd')}"></time><span th:text="|· ${post.readingMinutes}분 읽기|">· 5분 읽기</span></div>
          <h2><a th:href="@{/posts/{slug}(slug=${post.slug})}"><span th:text="${post.title}">글 제목</span></a></h2>
          <p class="post-summary" th:text="${post.summary}">요약</p>
          <ul class="tag-list"><li th:each="tag : ${post.tags}" th:text="|# ${tag}|">태그</li></ul>
          <a class="post-series-link" th:if="${post.seriesSlug != null}" th:href="@{/posts(series=${post.seriesSlug})}" th:text="|▤ ${post.seriesName} · ${post.seriesOrder}편 →|">시리즈 바로가기</a>
        </article>
      </div>
    <p class="empty-state" th:if="${posts.isEmpty()}">검색어에 맞는 글이 없습니다.</p>
  </section>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
