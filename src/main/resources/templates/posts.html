<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/site :: header}"></header>
<main class="shell page-space">
  <header class="page-intro">
    <p class="eyebrow">WRITING</p>
    <h1>글</h1>
    <p>개발과 기록, 작은 시스템을 운영하며 배운 내용을 정리합니다.</p>
  </header>
  <div class="post-list" th:if="${!posts.isEmpty()}">
    <article th:each="post : ${posts}">
      <div class="post-meta"><time th:text="${post.publishedAt}"></time><span th:text="|${post.readingMinutes}분 읽기|">5분 읽기</span></div>
      <div>
        <h2><a th:href="@{/posts/{slug}(slug=${post.slug})}" th:text="${post.title}">글 제목</a></h2>
        <p th:text="${post.summary}">요약</p>
        <ul class="tag-list"><li th:each="tag : ${post.tags}" th:text="${tag}">태그</li></ul>
      </div>
    </article>
  </div>
  <p class="empty-state" th:if="${posts.isEmpty()}">아직 공개된 글이 없습니다.</p>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
</body>
</html>
