<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/site :: head(${pageTitle})}"></head>
<body class="post-detail-page">
<header th:replace="~{fragments/site :: header}"></header>
<main>
  <article class="article">
    <header class="article-header">
      <a class="back-link" th:href="@{${post.boardPath()}}" th:text="|← ${post.boardName ?: '모든 글'}|">← 모든 글</a>
      <h1 th:text="${post.title}">글 제목</h1>

      <div class="post-meta"><time th:text="${post.publishedAt}"></time><span th:text="|${post.readingMinutes}분 읽기|">5분 읽기</span></div>
      <ul class="tag-list"><li th:each="tag : ${post.tags}" th:text="${tag}">태그</li></ul>
    </header>
    <div class="article-body" th:utext="${post.htmlContent}">본문</div>
    <section class="article-attachments" th:if="${!#lists.isEmpty(attachments)}" aria-labelledby="attachments-title">
      <h2 id="attachments-title">첨부 파일</h2>
      <ul>
        <li th:each="file : ${attachments}"><a th:href="@{${file.url()}}" th:text="${file.name}" download>파일명</a>
          <span th:text="${file.displaySize()}">1.2 MB</span></li>
      </ul>
    </section>
  </article>
</main>
<footer th:replace="~{fragments/site :: footer}"></footer>
<script defer th:src="@{/js/tag-more.js}"></script>
</body>
</html>
