<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title th:text="${title}">dean.p</title>
  <script>
    (() => {
      const saved = localStorage.getItem('deanp-theme');
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0"></script>
  <script defer th:src="@{/js/site.js}"></script>
  <script defer th:src="@{/js/theme.js}"></script>
  <script defer th:src="@{/js/sidebar.js}"></script>
  <script defer th:src="@{/js/account-menu.js}"></script>
</head>
<body>
<th:block th:fragment="header">
<header class="site-header">
  <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-controls="site-sidebar" aria-expanded="false">☰</button>
  <a class="brand" th:href="@{/}" aria-label="dean.p 홈">dean<span>.</span>p</a>
  <a class="header-search" th:href="@{/search}" aria-label="검색"><i data-lucide="search" aria-hidden="true"></i></a>
  <div class="account-menu">
    <button class="account-toggle" type="button" aria-label="사용자 메뉴" aria-expanded="false" aria-controls="account-panel">
      <i data-lucide="user-round" aria-hidden="true"></i>
    </button>
    <section id="account-panel" class="account-panel" aria-labelledby="account-panel-title" hidden>
      <h2 id="account-panel-title">사용자 메뉴</h2>
      <th:block th:if="${currentUserName == null}">
        <p class="account-description">글을 쓰려면 로그인하세요.</p>
        <a class="account-action" th:href="@{/login}"><span>로그인</span></a>
      </th:block>
      <th:block th:if="${currentUserName != null}">
        <p class="account-description" th:text="|${currentUserName} 님으로 로그인했습니다.|">로그인했습니다.</p>
        <a class="account-action" th:if="${canWritePosts}" th:href="@{/admin}"><span>관리</span></a>
        <form method="post" th:action="@{/logout}"><button class="account-action" type="submit"><span>로그아웃</span></button></form>
      </th:block>
    </section>
  </div>
</header>
<div class="sidebar-backdrop" hidden></div>
<aside id="site-sidebar" class="site-sidebar" aria-label="사이트 메뉴" hidden>
  <div class="sidebar-scroll">
    <nav class="sidebar-nav" aria-label="주요 메뉴">
      <a class="sidebar-leaf" th:href="@{/about}">소개</a>
      <div class="sidebar-group">
        <div class="sidebar-group-head">
          <button class="sidebar-group-toggle" type="button" aria-controls="sidebar-posts-menu" th:if="${categories != null}"
                  th:attr="aria-expanded=${postsMenuOpen},aria-label=${postsMenuOpen} ? '글 메뉴 접기' : '글 메뉴 펼치기'"
                  data-group-toggle data-group-name="글">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="sidebar-group-spacer" th:unless="${categories != null}" aria-hidden="true"></span>
          <a id="sidebar-posts-title" th:href="@{/posts}">글</a>
        </div>
        <div id="sidebar-posts-menu" class="sidebar-subnav" role="group" aria-labelledby="sidebar-posts-title"
             th:if="${categories != null}" th:hidden="${!postsMenuOpen}">
          <div th:replace="~{fragments/filters :: filters}"></div>
        </div>
      </div>
      <div class="sidebar-group sidebar-admin" th:if="${canWritePosts}">
        <div class="sidebar-group-head">
          <button class="sidebar-group-toggle" type="button" aria-controls="sidebar-admin-menu"
                  th:attr="aria-expanded=${adminMenu != null},aria-label=${adminMenu != null} ? '관리자 메뉴 접기' : '관리자 메뉴 펼치기'"
                  data-group-toggle data-group-name="관리자">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <a id="sidebar-admin-title" th:href="@{/admin}">관리자</a>
        </div>
        <div id="sidebar-admin-menu" class="sidebar-subnav" role="group" aria-labelledby="sidebar-admin-title" th:hidden="${adminMenu == null}">
          <a th:href="@{/admin}" th:attr="aria-current=${adminMenu == 'dashboard'} ? 'page'">대시보드</a>
          <a th:href="@{/admin/posts}" th:attr="aria-current=${adminMenu == 'posts'} ? 'page'">글</a>
          <a th:href="@{/admin/posts/new}" th:attr="aria-current=${adminMenu == 'new'} ? 'page'">새 글</a>
          <a th:href="@{/admin/categories}" th:attr="aria-current=${adminMenu == 'categories'} ? 'page'">카테고리</a>
          <a th:href="@{/admin/series}" th:attr="aria-current=${adminMenu == 'series'} ? 'page'">시리즈</a>
          <a th:href="@{/admin/tags}" th:attr="aria-current=${adminMenu == 'tags'} ? 'page'">태그</a>
        </div>
      </div>
    </nav>
  </div>
  <div class="sidebar-theme"><button class="theme-toggle" type="button" data-theme-toggle aria-label="다크 모드로 전환"><i data-lucide="sun-moon" aria-hidden="true"></i></button></div>
</aside>
</th:block>
<footer class="site-footer" th:fragment="footer">
  <p>생각하고, 만들고, 기록합니다.</p>
  <p>© 2026 dean.p</p>
</footer>
</body>
</html>
