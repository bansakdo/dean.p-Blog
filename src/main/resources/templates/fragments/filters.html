<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="details">
        <section class="filter-block" aria-labelledby="series-filter-title">
          <h2 id="series-filter-title"><span th:text="${selectedCategoryName != null ? selectedCategoryName + '의 시리즈' : '시리즈'}">시리즈</span><span th:text="${seriesOptions.size()}">0</span></h2>
          <nav class="filter-links series-links" aria-label="시리즈">
            <a th:each="series : ${seriesOptions}" th:classappend="${series.slug == selectedSeries} ? 'is-active'"
               th:attr="aria-current=${series.slug == selectedSeries ? 'true' : null}"
               th:href="@{${filterBoard.path()}(category=${series.categorySlug}, series=${series.slug}, tag=${selectedTag}, q=${search}, size=${pageSize})}">
              <span class="series-name"><span th:text="${series.name}">시리즈</span><span aria-hidden="true" th:text="${series.slug == selectedSeries ? ' ✓' : ' →'}"> →</span></span>
              <span class="series-meta" th:text="|${series.postCount}편 · ${series.statusLabel()}|">0편 · 연재 중</span>
            </a>
          </nav>
          <p class="filter-help" th:text="${seriesOptions.isEmpty() ? '공개된 시리즈가 없습니다.' : (selectedCategory != null ? '선택한 카테고리의 시리즈입니다.' : '순서대로 읽는 연재 글입니다.')}">시리즈 안내</p>
        </section>
        <section class="filter-block" aria-labelledby="tag-filter-title">
          <h2 id="tag-filter-title">태그로 좁혀보기</h2>
          <nav class="tag-chip-links" aria-label="태그">
            <a th:if="${selectedTag != null}" th:href="@{${filterBoard.path()}(category=${selectedCategory}, series=${selectedSeries}, q=${search}, size=${pageSize})}">전체</a>
            <a th:each="tag : ${pinnedTagChips}" class="is-active" aria-current="true" th:attr="data-tag-slug=${tag.slug}"
               th:href="@{${filterBoard.path()}(category=${selectedCategory}, series=${selectedSeries}, tag=${tag.nextTags}, q=${search}, size=${pageSize})}"
               th:text="${tag.name}">선택한 태그</a>
            <a th:each="tag : ${tagChips}" th:classappend="${tag.selected} ? 'is-active'"
               th:attr="data-tag-slug=${tag.slug},aria-current=${tag.selected ? 'true' : null}"
               th:href="@{${filterBoard.path()}(category=${selectedCategory}, series=${selectedSeries}, tag=${tag.nextTags}, q=${search}, size=${pageSize})}"
               th:text="${tag.name}">태그</a>
          </nav>
          <button type="button" class="tag-more" data-tag-more th:if="${hasMoreTags}" th:attr="data-offset=${tags.size()},data-board=${filterBoard.slug()},data-list-path=${filterBoard.path()}">태그 더 보기</button>
          <p class="filter-help" data-tag-error role="alert" hidden>태그를 불러오지 못했습니다. 다시 시도해 주세요.</p>
          <p class="filter-help" th:if="${tags.isEmpty()}">등록된 태그가 없습니다.</p>
        </section>
        <p class="filter-help browse-hint">분류를 누르면 바로 반영됩니다.</p>
</th:block>
