server:
  port: ${WAS_PORT}

spring:
  config:
    import: "optional:file:./.env.dev[.properties]"
  autoconfigure:
    exclude: []
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: blog
  flyway:
    enabled: true
    default-schema: blog
    schemas: blog
    baseline-on-migrate: true

app:
  media:
    storage-root: ${APP_MEDIA_STORAGE_ROOT:../dean-p-blog-media}
  visitor:
    cookie-secure: false
    trusted-proxies: ${VISITOR_TRUSTED_PROXIES:}
    # 개발 서버는 내부망으로만 접속하고 E2E도 localhost로 조회하므로 사설 대역은 빼지 않는다.
    excluded-networks: ${VISITOR_EXCLUDED_NETWORKS:}
